name = "noark-luna-api"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true
# Preserve dashboard-managed public variables. Secrets are always preserved separately.
keep_vars = true

[vars]
ALLOWED_ORIGINS = "https://rolfss.github.io"
# TURNSTILE_SITE_KEY is intentionally configured in the Cloudflare dashboard,
# so activation requires no source-code edit and future deploys preserve it.

[[durable_objects.bindings]]
name = "LUNA_GATE"
class_name = "LunaGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LunaGate"]

[observability]
enabled = false
