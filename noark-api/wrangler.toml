name = "noark-luna-api"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://rolfss.github.io"
# Public Turnstile site key, NOT the secret key. Add the actual value before deploy.
TURNSTILE_SITE_KEY = ""

[[durable_objects.bindings]]
name = "LUNA_GATE"
class_name = "LunaGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LunaGate"]

[observability]
enabled = false
