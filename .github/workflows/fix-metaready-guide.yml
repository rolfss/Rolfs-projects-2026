name: Rett MetaReady-demoguiden

on:
  push:
    branches:
      - improve/existing-apps-sept-2026
    paths:
      - ".github/workflows/fix-metaready-guide.yml"

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: improve/existing-apps-sept-2026
          fetch-depth: 0
      - name: Rett aktiv visning
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('metaready/app.mjs')
          text=path.read_text(encoding='utf-8')
          for name in ['overview','catalog','readiness','lineage','backlog','audit']:
              text=text.replace(f"{{view:'{name}'", f"{{activeView:'{name}'")
          if "1:{activeView:'overview'" not in text or "6:{activeView:'audit'" not in text:
              raise SystemExit('Demotrinnene ble ikke oppdatert som forventet')
          path.write_text(text,encoding='utf-8')
          PY
          npm --prefix metaready test
          npm --prefix metaready run check
      - name: Lagre rettingen
        run: |
          rm -f .github/workflows/fix-metaready-guide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: naviger MetaReady-demoguiden mellom faktiske visninger"
          git push origin HEAD:improve/existing-apps-sept-2026
