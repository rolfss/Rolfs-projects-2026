name: Oppdater Brukerstøttejakten-kortet

on:
  push:
    branches:
      - upgrade/brukerstottejakten-3-webgl
    paths:
      - .github/workflows/patch-support-card-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/brukerstottejakten-3-webgl

      - name: Oppdater prosjektteksten
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('site/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<span class="label">Nytt nettleserspill</span>': '<span class="label">WebGL-nettleserspill</span>',
              '<h2>Skyt unna brukerstøttesakene. Bli årets ansatt.</h2>': '<h2>Ta kontroll over køen. Bli årets ansatt.</h2>',
              '<p>Et enkelt Duck Hunt-inspirert arkadespill med en intern vri: målene er flyvende «Brukerstøttesaker», våpenet heter Service Manager, og ti treff fyller måleren til årets ansatt.</p>': '<p>Et påkostet Duck Hunt-inspirert arkadespill med ekte WebGL-dybde, dynamisk lys og en intern IT-vri. Lukk flyvende «Brukerstøttesaker» med Service Manager, bestå tilfeldige Noark 5-kontroller og håndter den avsluttende hovedhendelsen.</p>',
              '<ul class="compact-facts"><li>Mus, berøring og tastatur</li><li>Retrolyd uten eksterne filer</li><li>6 automatiske tester</li></ul>': '<ul class="compact-facts"><li>Ekte WebGL med Canvas-reserve</li><li>Mus, berøring og tastatur</li><li>15 automatiske tester</li></ul>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Manglende tekst: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Kontroller og lagre
        run: |
          grep -q "Ekte WebGL med Canvas-reserve" site/index.html
          grep -q "15 automatiske tester" site/index.html
          rm -f .github/workflows/patch-support-card-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: oppdater presentasjonen av Brukerstøttejakten"
          git push origin HEAD:upgrade/brukerstottejakten-3-webgl
