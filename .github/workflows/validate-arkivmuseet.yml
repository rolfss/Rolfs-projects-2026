name: Kontroller Arkivmuseet
on:
  pull_request:
    paths:
      - 'arkivmuseet/**'
      - '.github/workflows/validate-arkivmuseet.yml'
permissions:
  contents: read
concurrency:
  group: museum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  museum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer, test og bygg
        working-directory: arkivmuseet
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Installer testnettleser
        working-directory: arkivmuseet
        run: pnpm exec playwright install --with-deps chromium
      - name: Kontroller Sak 17 og den opprinnelige museumsreisen
        working-directory: arkivmuseet
        run: |
          set -o pipefail
          mkdir -p qa-logs
          export MUSEUM_CHROME="$(pnpm exec node --input-type=module -e "import {chromium} from '@playwright/test'; console.log(chromium.executablePath());")"
          export MUSEUM_HEADED=1
          pnpm preview > qa-logs/preview.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:4196/Rolfs-projects-2026/arkivmuseet/ > /dev/null && break
            sleep 1
          done
          RESULT=0
          timeout 360s xvfb-run -a pnpm test:investigation 2>&1 | tee qa-logs/investigation.log || RESULT=1
          timeout 360s xvfb-run -a pnpm test:browser 2>&1 | tee qa-logs/original-museum.log || RESULT=1
          exit "$RESULT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: museum-qa
          path: |
            arkivmuseet/qa-investigation/
            arkivmuseet/qa-output/
            arkivmuseet/qa-logs/
          retention-days: 7
