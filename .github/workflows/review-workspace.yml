name: Review workspace snapshot
on:
  push:
    branches: ['review/app-reliability-20260926']
    paths: ['.github/workflows/review-workspace.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked public repository objects for offline review
        run: |
          mkdir -p review-output
          git bundle create review-output/repository.bundle HEAD refs/remotes/origin/main refs/remotes/origin/improve/arkivmuseet-leader-purpose refs/remotes/origin/codex/fix-pages-after-rename
          git bundle verify review-output/repository.bundle
          git rev-parse HEAD > review-output/snapshot-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-review-workspace
          path: review-output/
          retention-days: 1
          if-no-files-found: error
