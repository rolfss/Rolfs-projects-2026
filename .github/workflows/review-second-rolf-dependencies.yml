name: Review Second Rolf dependency advisories
on:
  push:
    branches: ['review/second-rolf-dependencies-20260926']
    paths: ['.github/workflows/review-second-rolf-dependencies.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read advisories from the committed lockfile without installing or upgrading
        working-directory: second-rolf-api
        shell: bash
        run: |
          mkdir -p dependency-review
          set +e
          npm audit --package-lock-only --ignore-scripts --json > dependency-review/all.json
          ALL_STATUS=$?
          npm audit --package-lock-only --ignore-scripts --omit=dev --json > dependency-review/production.json
          PROD_STATUS=$?
          set -e
          printf 'all_exit=%s\nproduction_exit=%s\n' "$ALL_STATUS" "$PROD_STATUS" > dependency-review/status.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for (const scope of ['all','production']) {
            const report=JSON.parse(readFileSync(`dependency-review/${scope}.json`,'utf8'));
            if (report.error || !report.metadata?.vulnerabilities) throw new Error(`Audit unavailable for ${scope}`);
            console.log(scope, JSON.stringify(report.metadata.vulnerabilities));
            for (const [name,v] of Object.entries(report.vulnerabilities??{})) {
              console.log(JSON.stringify({scope,name,severity:v.severity,direct:v.isDirect,range:v.range,nodes:v.nodes,via:v.via,fixAvailable:v.fixAvailable}));
            }
          }
          NODE
          git diff --exit-code -- package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: second-rolf-dependency-review
          path: second-rolf-api/dependency-review/
          retention-days: 1
          if-no-files-found: error
