name: Bygg Brukerstøttejakten 4.0

on:
  push:
    branches:
      - upgrade/brukerstottejakten-4
    paths:
      - ".github/workflows/materialize-brukerstotte-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Hent v4-grenen
        uses: actions/checkout@v6
        with:
          ref: upgrade/brukerstottejakten-4
          fetch-depth: 0

      - name: Verifiser og pakk ut spillkilden
        shell: bash
        run: |
          set -euo pipefail
          cat brukerstottejakten/.v4-payload/part-* | base64 --decode > /tmp/brukerstotte-v4.tar.xz
          actual_sha="$(sha256sum /tmp/brukerstotte-v4.tar.xz | cut -d' ' -f1)"
          expected_sha="a58c8d59dffe21c57aa5bfcf7690fd263d8e615a55189f919abb652131c3b6ea"
          test "$actual_sha" = "$expected_sha"
          tar -xJf /tmp/brukerstotte-v4.tar.xz -C brukerstottejakten
          test -f brukerstottejakten/meta-core.js
          grep -q "Brukerstøttejakten 4.0" brukerstottejakten/index.html

      - name: Kjør tester og syntakskontroll
        run: |
          npm --prefix brukerstottejakten test
          npm --prefix brukerstottejakten run check

      - name: Lagre verifisert v4-kilde
        shell: bash
        run: |
          set -euo pipefail
          rm -rf brukerstottejakten/.v4-payload
          rm -f .github/workflows/materialize-brukerstotte-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A brukerstottejakten .github/workflows/materialize-brukerstotte-v4.yml
          git diff --cached --quiet || git commit -m "feat: bygg Brukerstøttejakten 4.0"
          git push origin HEAD:upgrade/brukerstottejakten-4
