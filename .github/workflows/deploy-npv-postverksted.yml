name: Deploy NPV Postverksted

on:
  push:
    branches:
      - main
    paths:
      - "npv-postverksted/**"
      - ".github/workflows/deploy-npv-postverksted.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./npv-postverksted

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
