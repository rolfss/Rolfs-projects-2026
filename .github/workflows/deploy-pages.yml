name: Publiser prosjektsiden

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "archive-assist/**"
      - "metaready/**"
      - "lumen-relay/**"
      - "noark-assistent/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v6

      - name: Sett opp Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Kjør tester for Archive Assist
        working-directory: ./archive-assist
        run: npm test && npm run check

      - name: Kjør tester for MetaReady
        working-directory: ./metaready
        run: npm test

      - name: Kjør tester for Lumen Relay
        working-directory: ./lumen-relay
        run: npm test && npm run check

      - name: Kjør tester for Noark 5-arkivassistenten
        working-directory: ./noark-assistent
        run: npm run validate

      - name: Sett sammen den statiske siden
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp -R archive-assist _site/archive-assist
          cp -R metaready _site/metaready
          cp -R lumen-relay _site/lumen-relay
          cp -R noark-assistent _site/noark-assistent
          rm -rf _site/archive-assist/tests _site/archive-assist/package.json _site/archive-assist/README.md _site/archive-assist/ARKITEKTUR.md _site/archive-assist/PROSJEKTGRUNNLAG.md _site/archive-assist/SECURITY.md _site/archive-assist/LICENSE
          rm -rf _site/metaready/tests _site/metaready/package.json _site/metaready/README.md
          rm -rf _site/lumen-relay/tests _site/lumen-relay/package.json _site/lumen-relay/README.md _site/lumen-relay/DESIGN.md _site/lumen-relay/LICENSE
          rm -rf _site/noark-assistent/tests _site/noark-assistent/package.json _site/noark-assistent/README.md
          touch _site/.nojekyll

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp siden
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publiser siden
        id: deployment
        uses: actions/deploy-pages@v4
