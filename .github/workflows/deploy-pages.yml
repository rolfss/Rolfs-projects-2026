name: Deploy project portfolio

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "metaready/**"
      - "npv-postverksted/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test MetaReady
        working-directory: ./metaready
        run: npm test

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp -R metaready _site/metaready
          cp -R npv-postverksted _site/npv-postverksted
          rm -rf _site/metaready/tests _site/metaready/package.json _site/metaready/README.md
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
