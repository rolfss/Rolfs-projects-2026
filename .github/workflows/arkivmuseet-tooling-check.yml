name: Validate Arkivmuseet enhancement tooling

on:
  push:
    branches:
      - arkivmuseet/install-enhancement-tooling

permissions:
  contents: write

jobs:
  validate-and-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        working-directory: ./arkivmuseet
        run: pnpm install --no-frozen-lockfile

      - name: Audit dependencies
        working-directory: ./arkivmuseet
        run: pnpm audit --audit-level high

      - name: Run tests
        working-directory: ./arkivmuseet
        run: pnpm test

      - name: Build
        working-directory: ./arkivmuseet
        run: pnpm build

      - name: Commit refreshed lockfile
        shell: pwsh
        run: |
          $changed = git status --porcelain -- arkivmuseet/pnpm-lock.yaml
          if ($changed) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add arkivmuseet/pnpm-lock.yaml
            git commit -m "chore(arkivmuseet): refresh tooling lockfile"
            git push origin HEAD:$env:GITHUB_REF_NAME
          } else {
            Write-Host "Lockfile already current."
          }
