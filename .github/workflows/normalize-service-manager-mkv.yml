name: Normaliser Service Manager Mk V

on:
  push:
    branches:
      - upgrade/brukerstottejakten-4-campaign
    paths:
      - ".github/workflows/normalize-service-manager-mkv.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/brukerstottejakten-4-campaign

      - name: Oppdater alle betegnelser
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('brukerstottejakten/README.md'),
              Path('brukerstottejakten/index.html'),
              Path('brukerstottejakten/game-core.js'),
              Path('brukerstottejakten/styles.css'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('Service Manager Mk IV', 'Service Manager Mk V')
              text = text.replace('Service Manager Mk IV —', 'Service Manager Mk V —')
              path.write_text(text, encoding='utf-8')
          PY
          ! grep -R "Service Manager Mk IV" brukerstottejakten
          npm --prefix brukerstottejakten test
          npm --prefix brukerstottejakten run check

      - name: Lagre korrigeringen
        run: |
          rm -f .github/workflows/normalize-service-manager-mkv.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "polish: fullfør Service Manager Mk V-presentasjonen"
          git push origin HEAD:upgrade/brukerstottejakten-4-campaign
