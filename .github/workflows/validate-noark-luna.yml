name: Valider Noark og Luna-bakende
on:
  push:
    paths:
      - 'noark-assistent/**'
      - 'noark-api/**'
      - '.github/workflows/validate-noark-luna.yml'
  pull_request:
    paths:
      - 'noark-assistent/**'
      - 'noark-api/**'
      - '.github/workflows/validate-noark-luna.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Kjør deterministiske tester uten API-nøkkel
        working-directory: noark-assistent
        run: npm run validate
