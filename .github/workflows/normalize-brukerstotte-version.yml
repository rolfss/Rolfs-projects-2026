name: Normaliser Brukerstøttejakten 4.1

on:
  push:
    branches:
      - upgrade/brukerstottejakten-4-campaign
    paths:
      - ".github/workflows/normalize-brukerstotte-version.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/brukerstottejakten-4-campaign

      - name: Oppdater versjonsbetegnelsen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readme = Path('brukerstottejakten/README.md')
          readme.write_text(readme.read_text(encoding='utf-8').replace('Brukerstøttejakten 4.0', 'Brukerstøttejakten 4.1'), encoding='utf-8')

          index = Path('brukerstottejakten/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('Brukerstøttejakten 4.0', 'Brukerstøttejakten 4.1')
          text = text.replace('Kaffepausekampanjen · v4.0', 'Kaffepausekampanjen · v4.1')
          text = text.replace('KAFFEPAUSEKAMPANJEN · 4.0', 'KAFFEPAUSEKAMPANJEN · 4.1')
          index.write_text(text, encoding='utf-8')

          package_path = Path('brukerstottejakten/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '4.1.0'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          grep -q "Kaffepausekampanjen · v4.1" brukerstottejakten/index.html
          grep -q '"version": "4.1.0"' brukerstottejakten/package.json
          npm --prefix brukerstottejakten test
          npm --prefix brukerstottejakten run check

      - name: Lagre versjonen
        run: |
          rm -f .github/workflows/normalize-brukerstotte-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: merk kaffepausekampanjen som versjon 4.1"
          git push origin HEAD:upgrade/brukerstottejakten-4-campaign
