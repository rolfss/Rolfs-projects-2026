name: Validate Second Rolf local AI
on:
  push:
    paths: ['second-rolf-api/**', 'site/second-rolf/**', '.github/workflows/validate-second-rolf.yml']
  pull_request:
    paths: ['second-rolf-api/**', 'site/second-rolf/**', '.github/workflows/validate-second-rolf.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Public model connection diagnostic (not a model inference test)
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 15 \
            -H 'Origin: https://rolfss.github.io' \
            -H 'Cache-Control: no-cache' \
            -D - 'https://second-rolf-api.rolfsselas.workers.dev/api/second-rolf/health'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: second-rolf-api
      - run: npm test && npm run check && npx wrangler deploy --dry-run
        working-directory: second-rolf-api
      - name: Parse Windows repair script without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/second-rolf-api/local/repair.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Deploy Worker on main when authorized deployment credentials exist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: second-rolf-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::notice::Worker deployment SKIPPED: GitHub deployment credentials are not configured. Run local/repair.ps1 -DeployWorker on the Windows PC.'
            echo 'Worker deployment **skipped**: required GitHub secrets are not configured. Pages/tests are not proof of backend deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler deploy
          echo 'Worker deployed. The Windows connector still requires the matching checkout and a restart.' >> "$GITHUB_STEP_SUMMARY"
          node local/doctor.mjs --public-only || echo '::warning::Worker deployed, but public model readiness is not confirmed. Update/restart the Windows connector.'
