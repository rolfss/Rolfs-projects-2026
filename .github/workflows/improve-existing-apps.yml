name: Forbedre eksisterende apper

on:
  push:
    branches:
      - improve/existing-apps-sept-2026
    paths:
      - ".github/workflows/improve-existing-apps.yml"

permissions:
  contents: write

jobs:
  improve-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Hent forbedringsgrenen
        uses: actions/checkout@v6
        with:
          ref: improve/existing-apps-sept-2026
          fetch-depth: 0

      - name: Koble forbedringene til appene
        run: python .github/scripts/improve_existing_apps.py

      - name: Test Noark-assistenten
        run: npm --prefix noark-assistent run validate

      - name: Test Archive Assist
        run: npm --prefix archive-assist test && npm --prefix archive-assist run check

      - name: Test MetaReady
        run: npm --prefix metaready test && npm --prefix metaready run check

      - name: Regressionstest Lumen Relay
        run: npm --prefix lumen-relay test && npm --prefix lumen-relay run check

      - name: Test Brukerstøttejakten
        run: npm --prefix brukerstottejakten test && npm --prefix brukerstottejakten run check

      - name: Kontroller produktkontraktene
        run: |
          grep -q "Kopier beslutningsnotat" noark-assistent/app.mjs
          grep -q "Kontrollrapport" archive-assist/index.html
          grep -q "MetaReady på tre minutter" metaready/index.html
          grep -q "QUIZ_TRIGGER_PROBABILITY = 0.15" brukerstottejakten/game-core.js
          grep -q 'id="musicButton"' brukerstottejakten/index.html
          grep -q "muzzle-flash { display: none" brukerstottejakten/styles.css
          grep -q "10 nivåer · 80 saker" site/index.html

      - name: Lagre testet forbedringsrunde
        run: |
          rm -f .github/workflows/improve-existing-apps.yml
          rm -f .github/scripts/improve_existing_apps.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: styrk eksisterende apper med beslutningsstøtte og tryggere UX"
          git push origin HEAD:improve/existing-apps-sept-2026
