name: Klargjør Archive Assist

on:
  push:
    branches:
      - archive-assist-release
    paths:
      - ".github/workflows/archive-assist-bootstrap.yml"

permissions:
  contents: write

jobs:
  klargjor:
    runs-on: ubuntu-latest
    steps:
      - name: Hent grenen
        uses: actions/checkout@v6
        with:
          ref: archive-assist-release

      - name: Pakk ut og test Archive Assist
        shell: bash
        run: |
          set -euo pipefail
          cat .archive-assist-bootstrap/part-* | base64 --decode > /tmp/archive-assist.tar.gz
          echo "2e156c1b44f8fbc98c30a06c80d6610efb490334b8ba72924140fca3468ea6af  /tmp/archive-assist.tar.gz" | sha256sum --check --strict
          rm -rf archive-assist metaready
          tar -xzf /tmp/archive-assist.tar.gz -C .
          cd archive-assist
          npm test
          npm run check
          cd ..

      - name: Lag samlet prosjektendring
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .archive-assist-bootstrap
          git restore --source=HEAD -- .github/workflows
          git config user.name "Rolf Selås"
          git config user.email "64554963+rolfss@users.noreply.github.com"
          git add -A
          git commit -m "Bygg Archive Assist som filbasert metadataassistent"
          git push origin HEAD:archive-assist-release
