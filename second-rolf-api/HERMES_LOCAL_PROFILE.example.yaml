# Template for ~/.hermes/profiles/second-rolf/config.yaml
# Replace the two LOCAL_* placeholders with the model server and model already
# running on Rolf's workstation. Do not add cloud providers or fallback models.

model:
  provider: custom
  default: LOCAL_MODEL_NAME
  base_url: LOCAL_OPENAI_COMPATIBLE_BASE_URL

# Intentionally empty: Second Rolf must go offline rather than spend paid tokens.
fallback_providers: []

memory:
  memory_enabled: false
  user_profile_enabled: false

# Suppress action-capable and private-state toolsets for this public profile.
agent:
  disabled_toolsets:
    - terminal
    - file
    - browser
    - web
    - skills
    - memory
    - session_search
    - cronjob
    - code_execution
    - delegation
    - messaging
    - homeassistant
    - discord
    - discord_admin

# Explicit API-server route. The Cloudflare Worker always requests this alias
# with provider=custom. If the route is missing/misconfigured, the live request
# should fail rather than silently use another provider.
platforms:
  api_server:
    enabled: true
    extra:
      model_routes:
        second-rolf-local:
          provider: custom
          model: LOCAL_MODEL_NAME
          base_url: LOCAL_OPENAI_COMPATIBLE_BASE_URL

# Examples of LOCAL_OPENAI_COMPATIBLE_BASE_URL only:
# Ollama:    http://127.0.0.1:11434/v1
# LM Studio: http://127.0.0.1:1234/v1
# vLLM:      http://127.0.0.1:8000/v1
# llama.cpp: use the /v1 base of the local llama-server instance.
